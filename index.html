<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- my style -->
    <!-- font -->
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap");
    </style>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Meow+Script&display=swap");
    </style>

    <!-- icon -->
    <link
      href="https://cdn.jsdelivr.net/npm/remixicon@4.5.0/fonts/remixicon.css"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
    <title>ASKADIGI</title>
  </head>
  <body>
    <header>
      <nav class="navbar__container">
        <div class="nav__logo">
          <a href="#" class="text__bgd__four">Askadigi</a>
        </div>
        <ul class="nav__link">
          <li><a href="#home">Home</a></li>
          <li><a href="#about">About</a></li>
          <li><a href="#project">Project</a></li>
          <li><a href="#product">Product</a></li>
          <li><a href="#contact">Contact</a></li>
        </ul>
        <div class="nav__extra" id="menu">
          <span class="material-symbols-outlined"> menu </span>
        </div>
      </nav>
    </header>
    <!-- hero section -->
    <main class="hero__container" id="home">
      <h1>Welcome</h1>
    </main>
    <section class="about__container" id="about">
      <h2>About</h2>
    </section>
    <section class="project__container" id="project">
      <h2>Project</h2>
    </section>
    <section class="product__container" id="product">
      <h2>Product</h2>
    </section>
    <section class="contact__container" id="contact">
      <h2>Contact</h2>
    </section>
    <script src="js/script.js"></script>
  </body>
</html>
